<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Darts Math Trainer</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0; padding: 0;
            background-color: #000000; color: #ecf0f1;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        .brand-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 15px; background: #111; border-bottom: 1px solid #333;
        }
        .logo-placeholder { font-weight: 900; font-style: italic; font-size: 1.2rem; letter-spacing: -1px; }
        .pdc { color: #004a99; }
        .target { color: #e61e2a; }

        header {
            display: flex; justify-content: center; padding: 10px;
            background: #1a1a1a; border-bottom: 2px solid #333; position: relative;
        }
        #total-left { 
            font-size: 2.2rem; font-weight: bold; color: #f1c40f; 
            border: 1px solid #444; border-radius: 8px; padding: 2px 40px;
            cursor: pointer; background: #000; min-width: 150px; text-align: center;
        }
        .game-shot-anim { color: #fff !important; background: #d4af37 !important; border-color: #fff !important; }
        .incorrect-anim { color: #fff !important; background: #c0392b !important; border-color: #fff !important; font-size: 1.2rem !important; }

        #refresh-board {
            position: absolute; right: 10px; top: 15px; background: #333; color: #fff;
            border: 1px solid #555; padding: 5px 10px; border-radius: 4px; font-size: 0.7rem;
        }

        #turn-log { display: flex; justify-content: center; gap: 8px; padding: 10px; background: #222; }
        .dart-slot {
            background: #333; padding: 5px 10px; border-radius: 4px;
            min-width: 65px; text-align: center; font-weight: bold; font-size: 1rem;
            border: 1px solid #004a99; color: #fff;
        }

        main {
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            position: relative; padding: 10px; overflow: hidden; background: #000;
        }
        #canvas-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { touch-action: none; background: #000; }

        footer {
            background: #1a1a1a; border-top: 3px solid #004a99; padding: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        #throwBtn {
            width: 100%; max-width: 400px; padding: 16px; background: #27ae60; color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem;
            box-shadow: 0 4px 0 #1e8449;
        }
        #throwBtn:disabled { background: #34495e; box-shadow: none; opacity: 0.5; }

        #keypad-container {
            display: none; width: 100%; max-width: 400px; flex-direction: column; gap: 5px;
        }
        #keypad-container.active { display: flex; }
        .display-row { display: flex; gap: 5px; margin-bottom: 5px; }
        #calc-display {
            flex-grow: 1; background: #000; color: #2ecc71; padding: 10px;
            font-family: monospace; font-size: 1.4rem; text-align: right; border-radius: 4px; border: 1px solid #444;
        }
        .key-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .key { background: #333; border: none; color: white; padding: 15px; font-size: 1.2rem; border-radius: 4px; }
        .key.submit { background: #004a99; grid-column: span 2; }
        .key.clear { background: #c0392b; }
    </style>
</head>
<body>

    <div class="brand-bar">
        <div class="logo-placeholder pdc">PDC</div>
        <div class="logo-placeholder target">TARGET</div>
    </div>

    <header>
        <div id="total-left" onclick="editStartingScore()">501</div>
        <button id="refresh-board" onclick="init()">FIX BOARD</button>
    </header>

    <div id="turn-log">
        <div class="dart-slot" id="d1">-</div>
        <div class="dart-slot" id="d2">-</div>
        <div class="dart-slot" id="d3">-</div>
    </div>

    <main>
        <div id="canvas-container">
            <canvas id="dartBoard"></canvas>
        </div>
    </main>

    <footer>
        <button id="throwBtn">RELEASE DART</button>
        <div id="keypad-container">
            <div class="display-row">
                <div id="calc-display">0</div>
                <button class="key clear" onclick="keyPress('C')">C</button>
            </div>
            <div class="key-grid">
                <button class="key" onclick="keyPress('1')">1</button><button class="key" onclick="keyPress('2')">2</button><button class="key" onclick="keyPress('3')">3</button>
                <button class="key" onclick="keyPress('4')">4</button><button class="key" onclick="keyPress('5')">5</button><button class="key" onclick="keyPress('6')">6</button>
                <button class="key" onclick="keyPress('7')">7</button><button class="key" onclick="keyPress('8')">8</button><button class="key" onclick="keyPress('9')">9</button>
                <button class="key" onclick="keyPress('0')">0</button>
                <button class="key submit" onclick="keyPress('S')">CONFIRM</button>
            </div>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('dartBoard');
        const ctx = canvas.getContext('2d');
        const boardNumbers = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        const SIZE = 600;
        const CX = 300, CY = 300;
        const AIM_RADIUS = 90;

        let totalRemaining = 501;
        let dartsThrown = 0;
        let turnTotal = 0;
        let aimPoint = { x: CX, y: CY - 100 };
        let dartsOnBoard = [];
        let currentInput = "";
        let isLocked = false;

        function init() {
            const container = document.getElementById('canvas-container');
            const dim = Math.min(container.clientWidth, container.clientHeight);
            canvas.width = dim;
            canvas.height = dim;
            render();
        }

        function render() {
            const scale = canvas.width / SIZE;
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
            ctx.clearRect(0, 0, SIZE, SIZE);

            // Black Surround
            ctx.beginPath(); ctx.arc(CX, CY, 295, 0, Math.PI * 2);
            ctx.fillStyle = "#111"; ctx.fill();

            // Segments
            for (let i = 0; i < 20; i++) {
                const angle = (i * Math.PI / 10) - (Math.PI / 2) - (Math.PI / 20);
                const end = angle + (Math.PI / 10);
                
                ctx.beginPath(); ctx.moveTo(CX, CY);
                ctx.arc(CX, CY, 260, angle, end);
                ctx.fillStyle = (i % 2 === 0) ? "#000" : "#f1e5ac";
                ctx.fill();

                drawRing(260, 240, angle, end, (i % 2 === 0) ? "#e61e2a" : "#27ae60");
                drawRing(170, 150, angle, end, (i % 2 === 0) ? "#e61e2a" : "#27ae60");

                ctx.save();
                ctx.translate(CX, CY);
                ctx.rotate(angle + (Math.PI / 20) + Math.PI / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.fillText(boardNumbers[i], 0, -272);
                ctx.restore();
            }

            // Bulls
            ctx.beginPath(); ctx.arc(CX, CY, 22, 0, Math.PI * 2); ctx.fillStyle = "#27ae60"; ctx.fill();
            ctx.beginPath(); ctx.arc(CX, CY, 10, 0, Math.PI * 2); ctx.fillStyle = "#e61e2a"; ctx.fill();

            // Aiming Circle
            if (dartsThrown < 3 && !isLocked) {
                ctx.beginPath(); ctx.arc(aimPoint.x, aimPoint.y, AIM_RADIUS, 0, Math.PI * 2);
                ctx.strokeStyle = "#004a99"; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.stroke();
                ctx.setLineDash([]);
            }

            // Darts
            dartsOnBoard.forEach(d => {
                ctx.beginPath(); ctx.arc(d.x, d.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = "#fff"; ctx.fill();
                ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
            });
        }

        function drawRing(or, ir, sa, ea, col) {
            ctx.beginPath(); ctx.arc(CX, CY, or, sa, ea); ctx.arc(CX, CY, ir, ea, sa, true);
            ctx.fillStyle = col; ctx.fill();
        }

        function updateAim(e) {
            if (isLocked || dartsThrown >= 3) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const scale = SIZE / rect.width;
            aimPoint = { x: (clientX - rect.left) * scale, y: (clientY - rect.top) * scale };
            render();
        }

        canvas.addEventListener('pointerdown', updateAim);
        canvas.addEventListener('pointermove', (e) => { if(e.buttons > 0) updateAim(e); });

        document.getElementById('throwBtn').onclick = function() {
            if (isLocked || dartsThrown >= 3) return;
            
            let fx, fy;
            if (dartsThrown === 0 && Math.random() < 0.5) {
                fx = aimPoint.x; fy = aimPoint.y;
            } else {
                const r = Math.random() * AIM_RADIUS;
                const a = Math.random() * Math.PI * 2;
                fx = aimPoint.x + Math.cos(a) * r;
                fy = aimPoint.y + Math.sin(a) * r;
            }

            const res = getScore(fx, fy);
            dartsOnBoard.push({x: fx, y: fy});
            dartsThrown++;
            turnTotal += res.v;
            document.getElementById(`d${dartsThrown}`).innerText = res.n;
            render();

            const left = totalRemaining - turnTotal;
            if (left < 0 || left === 1 || (left === 0 && !res.d)) {
                doFeedback("BUST!", totalRemaining, 1500);
            } else if (left === 0 && res.d) {
                doFeedback("GAME SHOT", 501, 2500, true);
            } else if (dartsThrown === 3) {
                this.style.display = 'none';
                document.getElementById('keypad-container').classList.add('active');
            }
        };

        function doFeedback(msg, resetVal, time, win = false) {
            isLocked = true;
            const el = document.getElementById('total-left');
            el.innerText = msg;
            el.className = win ? 'game-shot-anim' : 'incorrect-anim';
            setTimeout(() => {
                totalRemaining = resetVal;
                el.innerText = totalRemaining;
                el.className = '';
                isLocked = false;
                resetTurn();
            }, time);
        }

        function keyPress(v) {
            if (v === 'C') currentInput = "";
            else if (v === 'S') {
                const guess = parseInt(currentInput);
                if (guess === turnTotal) {
                    totalRemaining -= turnTotal;
                    document.getElementById('total-left').innerText = totalRemaining;
                    resetTurn();
                } else {
                    const actual = turnTotal;
                    totalRemaining -= actual;
                    doFeedback(`WRONG: ${actual}`, totalRemaining, 2000);
                }
            } else if (currentInput.length < 3) {
                currentInput += v;
            }
            document.getElementById('calc-display').innerText = currentInput || "0";
        }

        function resetTurn() {
            dartsThrown = 0; turnTotal = 0; dartsOnBoard = []; currentInput = "";
            document.getElementById('calc-display').innerText = "0";
            document.getElementById('keypad-container').classList.remove('active');
            document.getElementById('throwBtn').style.display = 'block';
            document.querySelectorAll('.dart-slot').forEach(s => s.innerText = "-");
            render();
        }

        function getScore(x, y) {
            const dx = x - CX, dy = y - CY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 260) return { v: 0, n: "0", d: false };
            if (dist < 10) return { v: 50, n: "DB", d: true };
            if (dist < 22) return { v: 25, n: "B", d: false };
            let a = Math.atan2(dy, dx) + (Math.PI/2) + (Math.PI/20);
            if (a < 0) a += Math.PI*2;
            const num = boardNumbers[Math.floor((a / (Math.PI*2)) * 20) % 20];
            if (dist >= 240 && dist <= 260) return { v: num*2, n: "D"+num, d: true };
            if (dist >= 150 && dist <= 170) return { v: num*3, n: "T"+num, d: false };
            return { v: num, n: num.toString(), d: false };
        }

        window.onload = init;
        window.onresize = init;
    </script>
</body>
</html>
