<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Darts Math Trainer v3.3.2</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        body { 
            margin: 0; padding: 0; background-color: #000; color: #ecf0f1; 
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; position: fixed; width: 100%;
        }
        header { height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a1a; border-bottom: 3px solid #004a99; padding: 5px; flex-shrink: 0; position: relative; }
        
        .score-row { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; padding: 0 10px; }
        .side-box { width: 95px; height: 60px; background: #222; border: 1px solid #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .side-box span { font-size: 0.7rem; font-weight: bold; color: #fff; filter: blur(10px); text-align: center; padding: 2px; transition: filter 0.2s; line-height: 1.1; white-space: pre-wrap; }
        .side-box.revealed span { filter: blur(0); }
        .box-label { font-size: 0.6rem; color: #004a99; margin-top: 2px; font-weight: bold; text-transform: uppercase; }
        
        .player-box { display: flex; flex-direction: column; align-items: center; }
        .score-display { font-size: 2rem; font-weight: bold; border: 2px solid #444; border-radius: 8px; padding: 4px 12px; background: #000; min-width: 90px; text-align: center; }
        #total-left { color: #f1c40f; }
        #bot-left { color: #e61e2a; }
        
        .controls-row { display: flex; justify-content: center; gap: 8px; margin-top: 10px; width: 100%; padding: 0 10px; }
        .tool-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; flex: 1; max-width: 110px; font-weight: bold; }
        .active-mode { background: #004a99 !important; }
        
        .enabled-gold { background: #f1c40f !important; color: #000 !important; border-color: #d4ac0d !important; }
        .pressure-active { background: #c0392b !important; color: #fff !important; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        #turn-log { height: 50px; display: flex; justify-content: center; gap: 8px; padding: 8px; background: #111; flex-shrink: 0; }
        .dart-slot { background: #222; width: 65px; border-radius: 4px; text-align: center; font-weight: bold; font-size: 1rem; color: #fff; line-height: 34px; border: 1px solid #333; }
        
        main { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; touch-action: none; background: #000; }
        
        footer { min-height: 125px; background: #1a1a1a; border-top: 2px solid #004a99; padding: 10px; display: flex; flex-direction: column; align-items: center; width: 100%; flex-shrink: 0; }
        #throwBtn { width: 100%; max-width: 350px; padding: 18px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        #keypad-container { display: none; width: 100%; max-width: 450px; align-items: center; gap: 10px; }
        #keypad-container.active { display: flex; }
        #calc-display { background: #000; color: #2ecc71; width: 75px; height: 45px; font-size: 1.6rem; text-align: center; line-height: 45px; border: 2px solid #2ecc71; border-radius: 6px; }
        .key-grid { display: grid; grid-template-columns: repeat(5, 1fr) 1.2fr; gap: 5px; flex: 1; }
        .key { background: #333; color: #fff; border: none; height: 42px; border-radius: 4px; font-size: 1.1rem; border-bottom: 2px solid #111; }
        .key.submit { background: #004a99; grid-column: 6; grid-row: 1 / span 2; height: 89px; }
    </style>
</head>
<body>
    <header>
        <div class="score-row">
            <div id="co-box" class="side-box" onclick="this.classList.toggle('revealed')"><span id="co-guide">-</span><div class="box-label">Checkout</div></div>
            <div class="player-box"><div id="total-left" class="score-display">501</div></div>
            <div id="ref-box" class="side-box" onclick="this.classList.toggle('revealed')"><span id="ref-score">-</span><div class="box-label">REF</div></div>
            <div id="bot-left-box" class="player-box" style="display:none;"><div id="bot-left" class="score-display">501</div></div>
        </div>
        <div class="controls-row">
            <button class="tool-btn" id="mode-toggle" onclick="toggleMode()">TRAINING</button>
            <button class="tool-btn" id="diff-toggle" onclick="cycleDiff()">SKILL: BEG</button>
            <button class="tool-btn" id="action-btn" onclick="handleModeAction()">RANDOM CO</button>
        </div>
    </header>

    <div id="turn-log">
        <div class="dart-slot" id="d1">-</div><div class="dart-slot" id="d2">-</div><div class="dart-slot" id="d3">-</div>
    </div>

    <main><canvas id="dartBoard"></canvas></main>

    <footer>
        <button id="throwBtn" onclick="userThrow()">RELEASE DART</button>
        <div id="bot-status" style="display:none; color:#e61e2a; font-weight:bold;">BOT IS THROWING...</div>
        <div id="keypad-container">
            <div style="display:flex; flex-direction:column; gap:5px;">
                <div id="calc-display">0</div>
                <button class="key" style="background:#c0392b; font-size:0.7rem; height:38px" onclick="keyIn('C', this)">CLR</button>
            </div>
            <div class="key-grid">
                <button class="key" onclick="keyIn('1', this)">1</button><button class="key" onclick="keyIn('2', this)">2</button><button class="key" onclick="keyIn('3', this)">3</button><button class="key" onclick="keyIn('4', this)">4</button><button class="key" onclick="keyIn('5', this)">5</button>
                <button class="key submit" onclick="keyIn('S', this)">ENT</button>
                <button class="key" onclick="keyIn('6', this)">6</button><button class="key" onclick="keyIn('7', this)">7</button><button class="key" onclick="keyIn('8', this)">8</button><button class="key" onclick="keyIn('9', this)">9</button><button class="key" onclick="keyIn('0', this)">0</button>
            </div>
        </div>
    </footer>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playThud() { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(100, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1); g.gain.setValueAtTime(0.4, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.1); }
        function playShatter() { const duration = 0.6, bS = audioCtx.sampleRate * duration, b = audioCtx.createBuffer(1, bS, audioCtx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < bS; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bS/5)); const n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain(); n.buffer = b; f.type = 'highpass'; f.frequency.value = 2000; g.gain.setValueAtTime(0.3, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration); n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start(); }
        function playSuccessChime() { [523.25, 659.25].forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, audioCtx.currentTime + (i * 0.08)); g.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.08)); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i * 0.08) + 0.3); o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + (i * 0.08)); o.stop(audioCtx.currentTime + (i * 0.08) + 0.3); }); }
        function playErrorBuzzer() { const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), g = audioCtx.createGain(); o1.type = 'sawtooth'; o1.frequency.value = 110; o2.type = 'sawtooth'; o2.frequency.value = 117; g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4); o1.connect(g); o2.connect(g); g.connect(audioCtx.destination); o1.start(); o2.start(); o1.stop(audioCtx.currentTime + 0.4); o2.stop(audioCtx.currentTime + 0.4); }

        let canvas, ctx, userScore = 501, botScore = 501, dartsThrown = 0, turnTotal = 0, dartsOnBoard = [], currentInput = "";
        let isMatch = false, isLocked = false, diffIdx = 0, isAutoCO = false, isPressure = false, aim = { x: 300, y: 150 };
        let pressureTimer = null, timeLeft = 10;
        const boardNumbers = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        const diffs = [{l:"BEG", r:80, botW: 65}, {l:"PRO", r:52.5, botW: 38}, {l:"MAX", r:0, botW: 8}];

        function getLiveCO(ref, dartsLeft) {
            if (ref <= 1 || ref > 170) return "-";
            
            // FULL PDC ROUTES (3 DARTS)
            const coMap3 = {
                170: ["T20", "T20", "BULL"], 167: ["T20", "T19", "BULL"], 161: ["T20", "T17", "BULL"],
                121: ["T20", "T11", "D14"], 109: ["T20", "S17", "D16"], 100: ["T20", "D20"], 90: ["T18", "D18"],
                81: ["T19", "D12"], 80: ["T20", "D10"], 63: ["T13", "D12"]
            };

            // PDC ROUTES (2 DARTS)
            const coMap2 = {
                109: ["T20", "D16"], 100: ["T20", "D20"], 90: ["T20", "D15"], 81: ["T19", "D12"], 
                70: ["T10", "D20"], 63: ["T13", "D12"], 61: ["T15", "D8"], 40: ["D20"]
            };

            if (dartsLeft === 3 && coMap3[ref]) return coMap3[ref].join("\n");
            if (dartsLeft === 2 && coMap2[ref]) return coMap2[ref].join("\n");
            if (ref <= 40 && ref % 2 === 0) return "D" + (ref / 2);

            // Back up dynamic logic
            for (let i = 20; i >= 1; i--) {
                if (ref - (i * 3) <= 40 && (ref - (i * 3)) % 2 === 0 && (ref - (i * 3)) > 0) return `T${i}\n(leaves D${(ref - i * 3) / 2})`;
                if (ref - i <= 40 && (ref - i) % 2 === 0 && (ref - i) > 0) return `S${i}\n(leaves D${(ref - i) / 2})`;
            }
            return ref > 60 ? "T20" : "T19";
        }

        function init() {
            canvas = document.getElementById('dartBoard'); ctx = canvas.getContext('2d');
            canvas.addEventListener('pointerdown', (e) => { if(audioCtx.state === 'suspended') audioCtx.resume(); handlePointer(e); });
            canvas.addEventListener('pointermove', (e) => { if(e.buttons > 0) handlePointer(e); });
            window.addEventListener('resize', resize); resize(); updateDisplay();
        }

        function handlePointer(e) { if(isLocked || dartsThrown >= 3) return; const r = canvas.getBoundingClientRect(); aim.x = (e.clientX - r.left) * (600 / r.width); aim.y = (e.clientY - r.top) * (600 / r.height); render(); }
        function resize() { const size = Math.min(window.innerWidth, window.innerHeight - 340); canvas.width = size; canvas.height = size; render(); }

        function render() {
            const sc = canvas.width/600; ctx.setTransform(sc, 0, 0, sc, 0, 0); ctx.clearRect(0, 0, 600, 600);
            ctx.beginPath(); ctx.arc(300, 300, 295, 0, Math.PI*2); ctx.fillStyle = "#111"; ctx.fill();
            for(let i=0; i<20; i++){
                let ang = (i * Math.PI / 10) - (Math.PI / 2) - (Math.PI / 20), end = ang + (Math.PI / 10);
                ctx.beginPath(); ctx.moveTo(300,300); ctx.arc(300,300,260,ang,end); ctx.fillStyle = i%2===0 ? "#000" : "#f1e5ac"; ctx.fill();
                drawRing(260, 240, ang, end, i%2===0 ? "#e61e2a" : "#27ae60");
                drawRing(170, 150, ang, end, i%2===0 ? "#e61e2a" : "#27ae60");
                ctx.save(); ctx.translate(300,300); ctx.rotate(ang + Math.PI/20 + Math.PI/2); ctx.fillStyle="#fff"; ctx.font="bold 20px Arial"; ctx.textAlign="center"; ctx.fillText(boardNumbers[i], 0, -275); ctx.restore();
            }
            ctx.beginPath(); ctx.arc(300,300,20,0,Math.PI*2); ctx.fillStyle="#27ae60"; ctx.fill();
            ctx.beginPath(); ctx.arc(300,300,10,0,Math.PI*2); ctx.fillStyle="#e61e2a"; ctx.fill();
            if(!isLocked && dartsThrown < 3){
                ctx.strokeStyle = "rgba(52, 152, 219, 0.6)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(aim.x, aim.y, diffs[diffIdx].r, 0, Math.PI*2); ctx.stroke();
                ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(aim.x - 20, aim.y); ctx.lineTo(aim.x + 20, aim.y); ctx.moveTo(aim.x, aim.y - 20); ctx.lineTo(aim.x, aim.y + 20); ctx.stroke();
            }
            dartsOnBoard.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, 8, 0, Math.PI*2); ctx.fillStyle = d.isBot ? "#e61e2a" : "#fff"; ctx.fill(); ctx.strokeStyle="#000"; ctx.stroke(); });
        }
        function drawRing(or, ir, sa, ea, c){ ctx.beginPath(); ctx.arc(300,300,or,sa,ea); ctx.arc(300,300,ir,ea,sa,true); ctx.fillStyle=c; ctx.fill(); }

        function userThrow() {
            if(isLocked || dartsThrown >= 3) return;
            playThud(); let rx = aim.x, ry = aim.y, rad = diffs[diffIdx].r;
            if(rad > 0){ let d = Math.random()*rad, a = Math.random()*Math.PI*2; rx += Math.cos(a)*d; ry += Math.sin(a)*d; }
            let s = getScore(rx, ry); dartsOnBoard.push({x:rx, y:ry, isBot:false}); dartsThrown++; turnTotal += s.v;
            document.getElementById(`d${dartsThrown}`).innerText = s.n; updateDisplay(); render();
            let rem = userScore - turnTotal;
            if(rem < 0 || rem === 1 || (rem === 0 && !s.d)){ playShatter(); feedback("BUST", "YOU"); }
            else if(rem === 0 && s.d) { feedback("GAME SHOT!", "YOU", true); }
            else if(dartsThrown === 3){
                if(isMatch && !isPressure) { userScore -= turnTotal; updateDisplay(); startBotTurn(); } 
                else { isLocked = true; document.getElementById('throwBtn').style.display = 'none'; document.getElementById('keypad-container').classList.add('active'); if(isPressure) startPressure(); }
            }
        }

        function getScore(x, y) {
            let dx = x-300, dy = y-300, d = Math.sqrt(dx*dx+dy*dy);
            if(d > 260) return {v:0, n:"0", d:false}; if(d < 10) return {v:50, n:"DB", d:true}; if(d < 20) return {v:25, n:"B", d:false};
            let a = Math.atan2(dy, dx) + Math.PI/2 + Math.PI/20; if(a < 0) a += Math.PI*2;
            let n = boardNumbers[Math.floor((a/(Math.PI*2))*20)%20];
            if(d > 240) return {v:n*2, n:"D"+n, d:true}; if(d > 150 && d < 170) return {v:n*3, n:"T"+n, d:false}; return {v:n, n:""+n, d:false};
        }

        function startPressure() {
            timeLeft = 10; stopPressureInterval();
            const btn = document.getElementById('action-btn');
            btn.innerText = `TIMEOUT: ${timeLeft}`;
            pressureTimer = setInterval(() => {
                timeLeft--; btn.innerText = `TIMEOUT: ${timeLeft}`;
                if(timeLeft <= 0) { playShatter(); stopPressureInterval(); feedback("TIMEOUT LOSS", "YOU", false); }
            }, 1000);
        }

        function stopPressureInterval() { clearInterval(pressureTimer); }

        async function startBotTurn() {
            stopPressureInterval(); isLocked = true; document.getElementById('throwBtn').style.display = 'none'; document.getElementById('bot-status').style.display = 'block';
            await new Promise(r => setTimeout(r, 600)); dartsOnBoard = []; document.querySelectorAll('.dart-slot').forEach(s => s.innerText = "-"); render();
            let bV = 0;
            for(let i=1; i<=3; i++){
                await new Promise(r => setTimeout(r, 800)); playThud();
                let bx = 300 + (Math.random()*diffs[diffIdx].botW*2 - diffs[diffIdx].botW), by = 150 + (Math.random()*diffs[diffIdx].botW*2 - diffs[diffIdx].botW);
                let s = getScore(bx, by);
                if(botScore - (bV + s.v) < 0 || botScore - (bV + s.v) === 1 || (botScore - (bV + s.v) === 0 && !s.d)) { playShatter(); feedback("BUST", "BOT"); return; }
                bV += s.v; dartsOnBoard.push({x:bx, y:by, isBot:true}); document.getElementById(`d${i}`).innerText = s.n; render();
                if(botScore - bV === 0 && s.d) { feedback("GAME SHOT!", "BOT", true); return; }
            }
            botScore -= bV; setTimeout(endTurn, 1000);
        }

        function feedback(msg, who, win = false){
            stopPressureInterval(); isLocked = true; const el = (who === "YOU") ? document.getElementById('total-left') : document.getElementById('bot-left');
            if(who === "YOU" && win) userScore = 0; updateDisplay();
            el.innerText = msg; el.className = win ? 'score-display gameshot' : 'score-display err';
            setTimeout(() => { el.className = 'score-display'; if(win || msg === "TIMEOUT LOSS") resetGame(); else if(isMatch && who === "YOU") startBotTurn(); else endTurn(); }, 1200);
        }

        function endTurn(){ 
            isLocked = false; dartsThrown = 0; turnTotal = 0; dartsOnBoard = []; currentInput = ""; 
            document.getElementById('throwBtn').style.display = 'block'; document.getElementById('bot-status').style.display = 'none'; 
            document.getElementById('keypad-container').classList.remove('active'); document.querySelectorAll('.dart-slot').forEach(s => s.innerText = "-"); 
            updateDisplay(); render();
            const btn = document.getElementById('action-btn');
            if(isMatch) btn.innerText = isPressure ? "PRESSURE ON" : "PRESSURE OFF"; else btn.innerText = "RANDOM CO";
        }
        
        function toggleMode(){ 
            isMatch = !isMatch; isAutoCO = false; isPressure = false; stopPressureInterval();
            const btn = document.getElementById('action-btn');
            btn.classList.remove('enabled-gold', 'pressure-active');
            btn.innerText = isMatch ? "PRESSURE OFF" : "RANDOM CO";
            document.getElementById('mode-toggle').innerText = isMatch ? "VS BOT" : "TRAINING";
            document.getElementById('mode-toggle').classList.toggle('active-mode');
            document.getElementById('co-box').style.display = isMatch ? 'none' : 'flex';
            document.getElementById('bot-left-box').style.display = isMatch ? 'flex' : 'none';
            resetGame();
        }

        function handleModeAction() {
            const btn = document.getElementById('action-btn');
            if(isMatch) {
                isPressure = !isPressure; btn.innerText = isPressure ? "PRESSURE ON" : "PRESSURE OFF";
                if(isPressure) btn.classList.add('pressure-active'); else btn.classList.remove('pressure-active');
            } else {
                isAutoCO = !isAutoCO;
                if(isAutoCO) { btn.classList.add('enabled-gold'); setRandomTarget(); } else { btn.classList.remove('enabled-gold'); resetGame(); }
            }
        }

        function resetGame(){ userScore = 501; botScore = 501; if(isAutoCO && !isMatch) setRandomTarget(); else endTurn(); }
        function setRandomTarget() { userScore = [170,161,158,143,121,109,100,80,63,40][Math.floor(Math.random()*10)]; endTurn(); }
        function updateDisplay() { let r = userScore - turnTotal; document.getElementById('ref-score').innerText = r; document.getElementById('total-left').innerText = userScore; document.getElementById('bot-left').innerText = botScore; if(!isMatch) document.getElementById('co-guide').innerText = getLiveCO(r, 3 - dartsThrown); }
        function cycleDiff(){ diffIdx = (diffIdx + 1) % 3; document.getElementById('diff-toggle').innerText = "SKILL: " + diffs[diffIdx].l; render(); }

        function keyIn(v, btn){ 
            if(btn) { btn.classList.add('active-tap'); setTimeout(() => btn.classList.remove('active-tap'), 100); } 
            if(v === 'C') currentInput = ""; 
            else if(v === 'S'){ 
                if(parseInt(currentInput) === turnTotal) { playSuccessChime(); stopPressureInterval(); userScore -= turnTotal; if(isMatch) { updateDisplay(); startBotTurn(); } else endTurn(); } 
                else { playErrorBuzzer(); document.getElementById('total-left').classList.add('err'); currentInput = ""; setTimeout(()=>document.getElementById('total-left').classList.remove('err'), 800); } 
            } else if(currentInput.length < 3) currentInput += v; 
            document.getElementById('calc-display').innerText = currentInput || "0"; 
        }
        window.onload = init;
    </script>
</body>
</html>
