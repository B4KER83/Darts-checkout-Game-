<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Darts Math Trainer</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        body { 
            margin: 0; padding: 0; background-color: #000; color: #ecf0f1; 
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; position: fixed; width: 100%;
        }
        header { height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a1a; border-bottom: 3px solid #004a99; padding: 5px; flex-shrink: 0; }
        .score-row { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; padding: 0 10px; }
        .side-box { width: 95px; height: 60px; background: #222; border: 1px solid #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .side-box span { font-size: 0.8rem; font-weight: bold; color: #fff; filter: blur(10px); text-align: center; padding: 2px; transition: filter 0.2s; line-height: 1.2; white-space: pre-wrap; }
        .side-box.revealed span { filter: blur(0); }
        .box-label { font-size: 0.6rem; color: #004a99; margin-top: 2px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .player-box { display: flex; flex-direction: column; align-items: center; }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .score-display { font-size: 2rem; font-weight: bold; border: 2px solid #444; border-radius: 8px; padding: 4px 12px; background: #000; min-width: 90px; text-align: center; }
        #total-left { color: #f1c40f; }
        #bot-left { color: #e61e2a; }
        #bot-left-box { display: none; }
        .controls-row { display: flex; justify-content: center; gap: 8px; margin-top: 10px; width: 100%; padding: 0 10px; }
        .tool-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; flex: 1; max-width: 110px; font-weight: bold; }
        .active-mode { background: #004a99 !important; border-color: #3498db !important; }
        .pressure-active { background: #c0392b !important; border-color: #ff4d4d !important; color: #fff !important; animation: pulse-red 1s infinite; box-shadow: 0 0 15px #c0392b; }
        .auto-active { border-color: #f1c40f !important; color: #f1c40f !important; background: #443a00 !important; box-shadow: 0 0 12px #f1c40f; }
        #turn-log { height: 50px; display: flex; justify-content: center; gap: 8px; padding: 8px; background: #111; flex-shrink: 0; }
        .dart-slot { background: #222; width: 65px; border-radius: 4px; text-align: center; font-weight: bold; font-size: 1rem; color: #fff; line-height: 34px; border: 1px solid #333; }
        main { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #canvas-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: absolute; }
        canvas { max-width: 100%; max-height: 100%; touch-action: none; }
        footer { min-height: 125px; background: #1a1a1a; border-top: 2px solid #004a99; padding: 10px; display: flex; flex-direction: column; align-items: center; width: 100%; flex-shrink: 0; }
        #throwBtn { width: 100%; max-width: 350px; padding: 18px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        #bot-status { display: none; color: #e61e2a; font-weight: bold; animation: pulse 1s infinite; margin: 10px; font-size: 1.2rem; }
        #keypad-container { display: none; width: 100%; max-width: 450px; align-items: center; gap: 10px; }
        #keypad-container.active { display: flex; }
        #calc-display { background: #000; color: #2ecc71; width: 75px; height: 45px; font-size: 1.6rem; text-align: center; line-height: 45px; border: 2px solid #2ecc71; border-radius: 6px; }
        .key-grid { display: grid; grid-template-columns: repeat(5, 1fr) 1.2fr; gap: 5px; flex: 1; }
        .key { background: #333; color: #fff; border: none; height: 42px; border-radius: 4px; font-size: 1.1rem; border-bottom: 2px solid #111; transition: none; }
        .key.submit { background: #004a99; grid-column: 6; grid-row: 1 / span 2; height: 89px; }
        .err { background: #c0392b !important; color: #fff !important; }
        .gameshot { background: #27ae60 !important; color: #fff !important; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        @keyframes pulse-red { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
</head>
<body>
    <header>
        <div class="score-row">
            <div id="co-box" class="side-box" onclick="this.classList.toggle('revealed')"><span id="co-guide">-</span><div class="box-label">Checkout</div></div>
            <div class="player-box"><span class="label">YOU</span><div id="total-left" class="score-display">501</div></div>
            <div id="ref-box" class="side-box" onclick="this.classList.toggle('revealed')"><span id="ref-score">-</span><div class="box-label">REF</div></div>
            <div id="bot-left-box" class="player-box"><span class="label">BOT</span><div id="bot-left" class="score-display">501</div></div>
        </div>
        <div class="controls-row">
            <button class="tool-btn" id="mode-toggle" onclick="toggleMode()">TRAINING</button>
            <button class="tool-btn" id="diff-toggle" onclick="cycleDiff()">SKILL: BEG</button>
            <button class="tool-btn" id="action-btn" onclick="handleModeAction()">RANDOM CO</button>
        </div>
    </header>
    <div id="turn-log">
        <div class="dart-slot" id="d1">-</div>
        <div class="dart-slot" id="d2">-</div>
        <div class="dart-slot" id="d3">-</div>
    </div>
    <main><div id="canvas-container"><canvas id="dartBoard"></canvas></div></main>
    <footer>
        <button id="throwBtn" onclick="userThrow()">RELEASE DART</button>
        <div id="bot-status">BOT IS THROWING...</div>
        <div id="keypad-container">
            <div style="display:flex; flex-direction:column; gap:5px;">
                <div id="calc-display">0</div>
                <button class="key" id="key-CLR" style="background:#c0392b; font-size:0.7rem; height:38px" onclick="keyIn('C')">CLR</button>
            </div>
            <div class="key-grid">
                <button class="key" id="key-1" onclick="keyIn('1')">1</button><button class="key" id="key-2" onclick="keyIn('2')">2</button><button class="key" id="key-3" onclick="keyIn('3')">3</button><button class="key" id="key-4" onclick="keyIn('4')">4</button><button class="key" id="key-5" onclick="keyIn('5')">5</button>
                <button class="key submit" id="key-ENT" onclick="keyIn('S')">ENT</button>
                <button class="key" id="key-6" onclick="keyIn('6')">6</button><button class="key" id="key-7" onclick="keyIn('7')">7</button><button class="key" id="key-8" onclick="keyIn('8')">8</button><button class="key" id="key-9" onclick="keyIn('9')">9</button><button class="key" id="key-0" onclick="keyIn('0')">0</button>
            </div>
        </div>
    </footer>

    <script>
        let canvas, ctx;
        const boardNumbers = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        let userScore = 501, botScore = 501, dartsThrown = 0, turnTotal = 0, dartsOnBoard = [], currentInput = "";
        let isMatch = false, isLocked = false, diffIdx = 0, isAutoCO = false, isPressure = false, aim = { x: 300, y: 150 };
        let pressureTimer = null, timeLeft = 10;
        
        const diffs = [
            {l:"BEG", r:80, botWobble: 65}, 
            {l:"PRO", r:52.5, botWobble: 38}, 
            {l:"MAX", r:0,  botWobble: 8}
        ];

        const PDC_FIXED = {
            170:["T20","T20","BULL"], 167:["T20","T19","BULL"], 164:["T20","T18","BULL"], 161:["T20","T17","BULL"],
            160:["T20","T20","D20"], 158:["T20","T20","D19"], 157:["T20","T19","D20"], 156:["T20","T20","D18"],
            155:["T20","T19","D19"], 154:["T20","18","D20"], 153:["T20","T19","D18"], 152:["T20","T20","D16"],
            151:["T20","T17","D20"], 150:["T20","T18","D18"], 149:["T20","T19","D16"], 148:["T20","16","D20"],
            147:["T20","17","D18"], 146:["T20","18","D16"], 145:["T20","15","D20"], 144:["T20","T20","D12"],
            143:["T20","T17","D16"], 142:["T20","T14","D20"], 141:["T20","15","D18"], 140:["T20","16","D16"],
            102:["T20", "10", "D16"], 55:["15", "D20"]
        };

        function getLiveCO(ref, darts) {
            if (ref > 170 || [169, 168, 166, 165, 163, 162, 159].includes(ref)) return "SETUP";
            if (ref <= 1) return "-";
            if (ref === 50) return "BULL";
            if (ref <= 40 && ref % 2 === 0) return "D" + (ref / 2);
            if (PDC_FIXED[ref] && PDC_FIXED[ref].length <= darts) return PDC_FIXED[ref].join(" ");
            if (darts >= 2) {
                let rem = ref - 60;
                if (rem >= 2) { let sub = getLiveCO(rem, darts - 1); if (sub !== "SETUP") return "T20 " + sub; }
                rem = ref - 57;
                if (rem >= 2) { let sub = getLiveCO(rem, darts - 1); if (sub !== "SETUP") return "T19 " + sub; }
                for (let i = 20; i >= 1; i--) {
                    if (ref - (i * 3) >= 2 && (ref - (i * 3)) <= 40 && (ref - (i * 3)) % 2 === 0) return "T" + i + " D" + ((ref - (i * 3)) / 2);
                    if (ref - i >= 2 && (ref - i) <= 40 && (ref - i) % 2 === 0) return i + " D" + ((ref - i) / 2);
                }
            }
            if (darts > 0) {
                const favs = [40, 32, 36, 50];
                for (let f of favs) {
                    let need = ref - f;
                    if (need > 0 && need <= 60) {
                        let label = f === 50 ? "BULL" : "D" + (f / 2);
                        if (need % 3 === 0) return "T" + (need / 3) + " (L " + label + ")";
                        if (need <= 20) return need + " (L " + label + ")";
                    }
                }
            }
            return "SETUP";
        }

        function init() {
            canvas = document.getElementById('dartBoard'); ctx = canvas.getContext('2d');
            canvas.addEventListener('pointerdown', handlePointer);
            canvas.addEventListener('pointermove', (e) => { if(e.buttons > 0) handlePointer(e); });
            resize(); window.addEventListener('resize', resize); updateDisplay();
        }

        function handlePointer(e) {
            if(isLocked || dartsThrown >= 3) return;
            const r = canvas.getBoundingClientRect();
            aim.x = (e.clientX - r.left) * (600 / r.width);
            aim.y = (e.clientY - r.top) * (600 / r.height);
            render();
        }

        function resize() {
            const container = document.getElementById('canvas-container');
            const size = Math.min(container.clientWidth, container.clientHeight);
            canvas.width = size; canvas.height = size; render();
        }

        function render() {
            if(!ctx) return;
            const S = canvas.width, sc = S/600;
            ctx.setTransform(sc, 0, 0, sc, 0, 0); ctx.clearRect(0, 0, 600, 600);
            ctx.beginPath(); ctx.arc(300, 300, 295, 0, Math.PI*2); ctx.fillStyle = "#111"; ctx.fill();
            for(let i=0; i<20; i++){
                let ang = (i * Math.PI / 10) - (Math.PI / 2) - (Math.PI / 20), end = ang + (Math.PI / 10);
                ctx.beginPath(); ctx.moveTo(300,300); ctx.arc(300,300,260,ang,end);
                ctx.fillStyle = i%2===0 ? "#000" : "#f1e5ac"; ctx.fill();
                drawRing(260, 240, ang, end, i%2===0 ? "#e61e2a" : "#27ae60");
                drawRing(170, 150, ang, end, i%2===0 ? "#e61e2a" : "#27ae60");
                ctx.save(); ctx.translate(300,300); ctx.rotate(ang + Math.PI/20 + Math.PI/2);
                ctx.fillStyle="#fff"; ctx.font="bold 20px Arial"; ctx.textAlign="center"; ctx.fillText(boardNumbers[i], 0, -275); ctx.restore();
            }
            ctx.beginPath(); ctx.arc(300,300,20,0,Math.PI*2); ctx.fillStyle="#27ae60"; ctx.fill();
            ctx.beginPath(); ctx.arc(300,300,10,0,Math.PI*2); ctx.fillStyle="#e61e2a"; ctx.fill();
            if(!isLocked && dartsThrown < 3){
                ctx.strokeStyle = "rgba(52, 152, 219, 0.7)"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(aim.x, aim.y, diffs[diffIdx].r, 0, Math.PI*2); ctx.stroke();
                ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3; ctx.beginPath();
                ctx.moveTo(aim.x-25, aim.y); ctx.lineTo(aim.x+25, aim.y); ctx.moveTo(aim.x, aim.y-25); ctx.lineTo(aim.x, aim.y+25); ctx.stroke();
            }
            dartsOnBoard.forEach(d => {
                ctx.beginPath(); ctx.arc(d.x, d.y, 8, 0, Math.PI*2); ctx.fillStyle = d.isBot ? "#e61e2a" : "#fff"; ctx.fill(); ctx.strokeStyle="#000"; ctx.stroke();
            });
        }

        function drawRing(or, ir, sa, ea, c){ ctx.beginPath(); ctx.arc(300,300,or,sa,ea); ctx.arc(300,300,ir,ea,sa,true); ctx.fillStyle=c; ctx.fill(); }

        function userThrow() {
            if(isLocked || dartsThrown >= 3) return;
            stopPressure();
            let rx = aim.x, ry = aim.y, rad = diffs[diffIdx].r;
            if(rad > 0){ let d = Math.random()*rad, a = Math.random()*Math.PI*2; rx += Math.cos(a)*d; ry += Math.sin(a)*d; }
            let s = getScore(rx, ry); dartsOnBoard.push({x:rx, y:ry, isBot:false}); dartsThrown++; turnTotal += s.v;
            document.getElementById(`d${dartsThrown}`).innerText = s.n; 
            updateDisplay(); render();
            let rem = userScore - turnTotal;
            if(rem < 0 || rem === 1 || (rem === 0 && !s.d)){ feedback("BUST", "YOU"); }
            else if(rem === 0 && s.d){ feedback("GAME SHOT!", "YOU", true); }
            else if(dartsThrown === 3){
                if(isMatch) { userScore -= turnTotal; updateDisplay(); startBotTurn(); } 
                else { isLocked = true; document.getElementById('throwBtn').style.display = 'none'; document.getElementById('keypad-container').classList.add('active'); }
            } else if(isPressure) { startPressure(); }
        }

        function getScore(x, y) {
            let dx = x-300, dy = y-300, d = Math.sqrt(dx*dx+dy*dy);
            if(d > 260) return {v:0, n:"0", d:false};
            if(d < 10) return {v:50, n:"DB", d:true};
            if(d < 20) return {v:25, n:"B", d:false};
            let a = Math.atan2(dy, dx) + Math.PI/2 + Math.PI/20;
            if(a < 0) a += Math.PI*2;
            let n = boardNumbers[Math.floor((a/(Math.PI*2))*20)%20];
            if(d > 240) return {v:n*2, n:"D"+n, d:true};
            if(d > 150 && d < 170) return {v:n*3, n:"T"+n, d:false};
            return {v:n, n:""+n, d:false};
        }

        async function startBotTurn() {
            stopPressure();
            isLocked = true; document.getElementById('throwBtn').style.display = 'none'; document.getElementById('bot-status').style.display = 'block';
            await new Promise(r => setTimeout(r, 600));
            dartsOnBoard = []; document.querySelectorAll('.dart-slot').forEach(s => s.innerText = "-"); render();
            let bVisit = 0;
            let currentWobble = diffs[diffIdx].botWobble;
            for(let i=1; i<=3; i++){
                await new Promise(r => setTimeout(r, 800));
                let rem = botScore - bVisit;
                let tx, ty;
                if(rem > 60) { let idx=boardNumbers.indexOf(20); let a=(idx*Math.PI/10)-(Math.PI/2); tx=300+Math.cos(a)*160; ty=300+Math.sin(a)*160; }
                else if(rem <= 40 && rem % 2 === 0) { let idx=boardNumbers.indexOf(rem/2); let a=(idx*Math.PI/10)-(Math.PI/2); tx=300+Math.cos(a)*250; ty=300+Math.sin(a)*250; }
                else if(rem <= 60 && rem > 1) { let setupVal = (rem % 2 !== 0) ? 1 : Math.min(rem-2, 20); let idx=boardNumbers.indexOf(setupVal); let a=(idx*Math.PI/10)-(Math.PI/2); tx=300+Math.cos(a)*200; ty=300+Math.sin(a)*200; }
                else { tx=300; ty=150; }
                let bx = tx + (Math.random() * currentWobble * 2 - currentWobble);
                let by = ty + (Math.random() * currentWobble * 2 - currentWobble);
                let s = getScore(bx, by);
                if(botScore - (bVisit + s.v) < 0 || botScore - (bVisit + s.v) === 1 || (botScore - (bVisit + s.v) === 0 && !s.d)) { 
                    feedback("BUST", "BOT"); return; 
                }
                bVisit += s.v; dartsOnBoard.push({x:bx, y:by, isBot:true}); document.getElementById(`d${i}`).innerText = s.n; render();
                if(botScore - bVisit === 0 && s.d) { feedback("GAME SHOT!", "BOT", true); return; }
            }
            botScore -= bVisit; setTimeout(endTurn, 1000);
        }

        function feedback(msg, who, win = false){
            stopPressure();
            isLocked = true; const el = (who === "YOU") ? document.getElementById('total-left') : document.getElementById('bot-left');
            if(who === "YOU" && win) userScore = 0; updateDisplay();
            el.innerText = msg; el.className = win ? 'score-display gameshot' : 'score-display err';
            setTimeout(() => {
                el.className = 'score-display';
                if(win) resetGame(); else if(isMatch && who === "YOU") startBotTurn(); else endTurn();
            }, 1200);
        }

        function startPressure() {
            if(!isMatch || !isPressure) return;
            timeLeft = 10;
            const btn = document.getElementById('action-btn');
            btn.innerText = `TIMEOUT: ${timeLeft}`;
            clearInterval(pressureTimer);
            pressureTimer = setInterval(() => {
                timeLeft--;
                btn.innerText = `TIMEOUT: ${timeLeft}`;
                if(timeLeft <= 0) {
                    clearInterval(pressureTimer);
                    feedback("TIMEOUT LOSS", "YOU", false);
                    resetGame();
                }
            }, 1000);
        }

        function stopPressure() {
            clearInterval(pressureTimer);
            if(isMatch && isPressure) document.getElementById('action-btn').innerText = "PRESSURE ON";
        }

        function endTurn(){
            isLocked = false; dartsThrown = 0; turnTotal = 0; dartsOnBoard = []; currentInput = "";
            document.getElementById('throwBtn').style.display = 'block'; document.getElementById('bot-status').style.display = 'none';
            document.getElementById('keypad-container').classList.remove('active'); document.getElementById('calc-display').innerText = "0";
            document.querySelectorAll('.dart-slot').forEach(s => s.innerText = "-"); updateDisplay(); render();
            if(isMatch && isPressure) startPressure();
        }

        function toggleMode(){
            isMatch = !isMatch; isAutoCO = false; isPressure = false;
            stopPressure();
            document.getElementById('mode-toggle').innerText = isMatch ? "VS BOT" : "TRAINING";
            document.getElementById('mode-toggle').classList.toggle('active-mode');
            document.getElementById('co-box').style.display = isMatch ? 'none' : 'flex';
            document.getElementById('bot-left-box').style.display = isMatch ? 'flex' : 'none';
            
            const btn = document.getElementById('action-btn');
            btn.className = "tool-btn";
            btn.innerText = isMatch ? "PRESSURE OFF" : "RANDOM CO";
            resetGame();
        }

        function resetGame(){ 
            userScore = 501; botScore = 501; 
            stopPressure();
            if(isAutoCO && !isMatch) setRandomTarget(); 
            else endTurn(); 
        }
        
        function setRandomTarget() { userScore = Math.floor(Math.random() * 130) + 41; endTurn(); }

        function handleModeAction() { 
            if(isMatch) { 
                isPressure = !isPressure;
                const btn = document.getElementById('action-btn');
                if(isPressure) {
                    btn.classList.add('pressure-active');
                    btn.innerText = "PRESSURE ON";
                    startPressure();
                } else {
                    btn.classList.remove('pressure-active');
                    btn.innerText = "PRESSURE OFF";
                    stopPressure();
                }
            } else {
                isAutoCO = !isAutoCO; 
                const btn = document.getElementById('action-btn'); 
                if(isAutoCO) { btn.classList.add('auto-active'); setRandomTarget(); } 
                else { btn.classList.remove('auto-active'); resetGame(); } 
            }
        }

        function updateDisplay() {
            const currentRem = userScore - turnTotal;
            const dartsLeft = 3 - dartsThrown;
            document.getElementById('ref-score').innerText = currentRem;
            document.getElementById('total-left').innerText = userScore;
            document.getElementById('bot-left').innerText = botScore;
            if(!isMatch) { document.getElementById('co-guide').innerText = getLiveCO(currentRem, dartsLeft); }
        }

        function cycleDiff(){ diffIdx = (diffIdx + 1) % 3; document.getElementById('diff-toggle').innerText = "SKILL: " + diffs[diffIdx].l; render(); }
        
        function keyIn(v){
            let keyId = v === 'S' ? 'key-ENT' : v === 'C' ? 'key-CLR' : 'key-' + v;
            let el = document.getElementById(keyId);
            if(el) {
                el.style.background = "#fff"; el.style.color = "#000";
                setTimeout(() => { el.style.background = ""; el.style.color = ""; }, 100);
            }
            if(v === 'C') currentInput = "";
            else if(v === 'S'){
                if(parseInt(currentInput) === turnTotal) { 
                    userScore -= turnTotal; 
                    if(isAutoCO && userScore === 0) { setRandomTarget(); } else { endTurn(); }
                } else { 
                    document.getElementById('total-left').classList.add('err'); 
                    currentInput = ""; 
                    setTimeout(()=>document.getElementById('total-left').classList.remove('err'), 800); 
                }
            } else if(currentInput.length < 3) currentInput += v;
            document.getElementById('calc-display').innerText = currentInput || "0";
        }

        window.onload = init;
    </script>
</body>
</html>
